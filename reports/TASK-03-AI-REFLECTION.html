<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 03: AI & Testing Reflection</title>
  <style>
    :root { color-scheme: light; font-family: Segoe UI, sans-serif; color: #17212b; background: #eef2f5; }
    body { margin: 0; }
    main { max-width: 1100px; margin: 0 auto; padding: 36px 22px 64px; }
    article { background: #fff; border: 1px solid #d6dee6; border-radius: 10px; padding: 36px 42px; box-shadow: 0 6px 22px rgba(20, 40, 60, 0.08); }
    h1 { margin-top: 0; padding-bottom: 16px; border-bottom: 3px solid #176b87; font-size: 32px; }
    h2 { margin-top: 32px; padding-top: 14px; border-top: 1px solid #dce3e8; color: #14566e; }
    h3 { margin-top: 24px; color: #2a3d4d; }
    p, li { line-height: 1.7; font-size: 16px; }
    ul, ol { padding-left: 22px; }
    code { padding: 2px 6px; border-radius: 4px; background: #edf1f4; font-family: Consolas, monospace; font-size: 0.92em; }
    blockquote { margin: 22px 0; padding: 12px 18px; border-left: 4px solid #e0a126; background: #fff8e8; }
    .meta { margin: -4px 0 26px; color: #667784; font-size: 13px; }
    @media (max-width: 760px) { main { padding: 16px 10px 36px; } article { padding: 22px 18px; } h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <main>
    <article>
      <p class="meta">Generated $(Get-Date -Format o) from <code>TASK-03-AI-REFLECTION.md</code></p>
      $md
    </article>
  </main>
</body>
</html>
